name: Elixir CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:

    name: Build and test
    runs-on: ubuntu-latest
    env:
      ELIXIR_ERL_OPTIONS: +P 5000000

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Elixir
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
      with:
        elixir-version: '1.17.3' # [Required] Define the Elixir version
        otp-version: '26.0'      # [Required] Define the Erlang/OTP version
    - name: Restore dependencies cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-
    - name: Install dependencies
      run: mix deps.get
    - name: Tests
      run: mix test
    - name: Demo with default parameters
      run: mix run
    - name: Demo with 100k neurons voting
      run: time N_NEURONS=1000000 mix run
    - name: Demo with receiving predictions from all neurons
      run: time N_NEURONS=10000 NEURON_SLEEP_FOR_MS=100 PREDICTION_DEADLINE_MS=1000 mix run

  pythonx:

    name: Voting in Python
    runs-on: ubuntu-latest
    env:
      ELIXIR_ERL_OPTIONS: +P 5000000

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Elixir
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
      with:
        elixir-version: '1.17.3' # [Required] Define the Elixir version
        otp-version: '26.0'      # [Required] Define the Erlang/OTP version
    - name: Install dependencies
        # Pythonx fetches its own uv and CPython on first compile
      run: mix deps.get && mix compile
    - name: Voting in Python tests
      run: mix test --include pythonx
    - name: Demo voting in Python
      run: USE_PYTHONX=1 N_NEURONS=10000 PREDICTION_DEADLINE_MS=1000 mix run
